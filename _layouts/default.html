<!doctype html>
<html lang="{{ site.lang | default: 'id-ID' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8f0f22">
  {% seo %}
  <link rel="icon" type="image/png" href="{{ '/assets/img/aksisoft-monogram.png' | relative_url }}">
  <script>document.documentElement.classList.add('js-ready');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/products.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/catalog.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/redesign.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/redesign2.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/redesign3.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/redesign4.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/redesign5.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/redesign6.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/redesign7.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body class="{% if page.url == '/' %}is-home{% else %}is-inner{% endif %}">
  {% include header.html %}
  <main class="{% if page.url == '/' %}home-main{% else %}site-main{% endif %}">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
