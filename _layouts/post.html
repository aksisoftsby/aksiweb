---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="eyebrow">Blog</p>
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%d %B %Y" }}{% if page.author %} • {{ page.author }}{% endif %}</p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
