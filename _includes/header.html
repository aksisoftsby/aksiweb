<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="Beranda">
    <span class="brand-mark">A</span>
    <span>Aksisoft Media</span>
  </a>
  <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
  <nav id="site-nav" class="site-nav" aria-label="Navigasi utama">
    {% for item in site.nav %}
      {% if item.children %}
        <div class="nav-item dropdown">
          <a href="{{ item.url | relative_url }}" class="dropdown-toggle">{{ item.title }} <span class="dropdown-arrow">▼</span></a>
          <ul class="dropdown-menu">
            {% for child in item.children %}
              <li><a href="{{ child.url | relative_url }}">{{ child.title }}</a></li>
            {% endfor %}
          </ul>
        </div>
      {% else %}
        <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
      {% endif %}
    {% endfor %}
  </nav>
</header>
