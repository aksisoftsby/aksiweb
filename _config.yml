title: "Aksisoft Media - Jasa Pembuatan Website Profesional"
description: "Jasa pembuatan website company profile, landing page, toko online sederhana, dan blog untuk bisnis UMKM. Cepat, responsif, dan SEO-ready."
url: "https://aksisoft.web.id"
baseurl: "/"
lang: id-ID
timezone: Asia/Jakarta
logo: /assets/img/logo.png

author:
  name: "Aksisoft Media"
  url: "https://aksisoftsby.github.io/aksiweb/"
  twitter: ""

social:
  name: "Aksisoft Media"
  links:
    - "https://github.com/aksisoftsby"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

permalink: /blog/:title/

collections:
  pages:
    output: true
    permalink: /:name/
  portfolio:
    output: true
    permalink: /portfolio/:title/
  websites:
    output: true
    permalink: /website/:name/

nav:
  - title: Beranda
    url: /
  - title: Layanan
    url: /layanan/
    children:
      - title: Website Static
        url: /layanan/website-static/
      - title: Website News Dynamic
        url: /layanan/website-news-dynamic/
      - title: Google Ads
        url: /layanan/google-ads/
      - title: Social Media Ads
        url: /layanan/social-media-ads/
  - title: Produk
    url: /produk/
    children:
      - title: RideSip
        url: /produk/ridesip/
      - title: Aksi CRM
        url: /produk/aksi-crm/
      - title: AksiSoft POS
        url: /produk/aksisoft-pos/
      - title: WebSekolah + PPDB
        url: /produk/websekolah/
  - title: Portfolio
    url: /portfolio/
  - title: Template
    url: /website/
  - title: Blog
    url: /blog/
  - title: Tentang
    url: /tentang/
  - title: Kontak
    url: /kontak/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - generate.js
  - generate.bat
  - GENERATOR-README.md
