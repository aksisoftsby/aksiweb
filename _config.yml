title: "Jasa Pembuatan Website Profesional | Aksisoft MEDIA"
description: "Jasa pembuatan website company profile, landing page, toko online sederhana, dan blog untuk bisnis UMKM. Cepat, responsif, dan SEO-ready."
url: "https://aksisoftsby.github.io"
baseurl: "/aksiweb"
lang: id-ID
timezone: Asia/Jakarta
logo: /assets/img/logo.png

author:
  name: "Aksisoft MEDIA"
  url: "https://aksisoftsby.github.io/aksiweb/"
  twitter: ""

social:
  name: "Aksisoft MEDIA"
  links:
    - "https://github.com/aksisoftsby"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

permalink: /blog/:title/

collections:
  pages:
    output: true
    permalink: /:name/

nav:
  - title: Beranda
    url: /
  - title: Layanan
    url: /layanan/
  - title: Portfolio
    url: /portfolio/
  - title: Blog
    url: /blog/
  - title: Tentang
    url: /tentang/
  - title: Kontak
    url: /kontak/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
